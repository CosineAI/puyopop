<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Puyo Pop Clone - Two Player</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main>
    <h1 style="text-align:center;margin-top:0;">Puyo Pop Clone — Two Player</h1>
    <section class="game-wrap two">
      <div class="player" id="player1">
        <canvas id="game1" width="288" height="576" aria-label="Player 1 board"></canvas>
        <div class="hud">
          <div class="hud-item score">
            <div class="label">Score (P1)</div>
            <div id="score1" class="value">0</div>
          </div>
          <div class="hud-item next">
            <canvas id="next1" width="96" height="96" aria-label="Next pair preview P1"></canvas>
          </div>
          <!-- Hidden stats to keep HUD updates working -->
          <div class="hud-hidden">
            <span id="chains1">0</span>
            <span id="speed1">1x</span>
            <span id="lines1">0</span>
          </div>
        </div>
      </div>

      <div class="player" id="player2">
        <canvas id="game2" width="288" height="576" aria-label="Player 2 board"></canvas>
        <div class="hud">
          <div class="hud-item score">
            <div class="label">Score (P2)</div>
            <div id="score2" class="value">0</div>
          </div>
          <div class="hud-item next">
            <canvas id="next2" width="96" height="96" aria-label="Next pair preview P2"></canvas>
          </div>
          <!-- Hidden stats to keep HUD updates working -->
          <div class="hud-hidden">
            <span id="chains2">0</span>
            <span id="speed2">1x</span>
            <span id="lines2">0</span>
          </div>
        </div>
      </div>
    </section>

    <div class="panel controls">
      <div class="label">Controls</div>
      <div class="controls-grid">
        <div>
          <strong>Player 1</strong>
          <ul>
            <li>A/D: Move</li>
            <li>S: Soft drop</li>
            <li>F/G: Rotate</li>
            <li>W: Hard drop</li>
          </ul>
        </div>
        <div>
          <strong>Player 2</strong>
          <ul>
            <li>Left/Right: Move</li>
            <li>Down: Soft drop</li>
            <li>Up: Hard drop</li>
            <li>, / .: Rotate</li>
          </ul>
        </div>
      </div>
      <button id="startBtn">Start / Restart</button>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 Puyo Pop Clone</p>
  </footer>
  <script src="assets/script.js"></script>
</body>
</html>
